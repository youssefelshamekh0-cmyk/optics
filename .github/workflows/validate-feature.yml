name: Validate feature branch

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/delivery-modal-daily-branch-ui

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const entries=Object.entries(a.vulnerabilities || {}); for (const [name,v] of entries) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:(v.via || []).map(x => typeof x === "string" ? x : {title:x.title,url:x.url})})); if (a.error || entries.length) process.exit(1);'
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
